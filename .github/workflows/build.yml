name: build image

# Builds and pushes the multi-arch python-runtime image on Dockerfile changes and on
# manual dispatch.
on:
  push:
    # renovate/** builds (without pushing) so Renovate can automerge on a green
    # branch.
    branches: [main, "renovate/**"]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/marck/python-runtime

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
          tags: |
            ${{ env.IMAGE }}:1.1.0
            ${{ env.IMAGE }}:latest
          provenance: false
