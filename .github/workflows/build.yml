name: build image

# Builds and pushes the multi-arch python-runtime image on Dockerfile changes and on
# manual dispatch.
on:
  push:
    # renovate/** builds (without pushing) so Renovate can automerge on a green
    # branch.
    branches: [main, "renovate/**"]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/marck/python-runtime

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
          tags: |
            ${{ env.IMAGE }}:1.1.0
            ${{ env.IMAGE }}:latest
          provenance: false
